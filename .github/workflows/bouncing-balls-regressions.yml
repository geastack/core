name: Bouncing Balls regressions
on:
  push:
    branches: [main]
    paths: ['packages/engine/**', 'packages/elements/**', 'packages/core/**', 'packages/geatsc-plugin-gea/**', '.github/workflows/bouncing-balls-regressions.yml']
  pull_request:
    paths: ['packages/engine/**', 'packages/elements/**', 'packages/core/**', 'packages/geatsc-plugin-gea/**', '.github/workflows/bouncing-balls-regressions.yml']
permissions:
  contents: read
jobs:
  behavior:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      GEA_NATIVE_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/core/test/test_native_object_cache.mjs
      - run: npm ci && npm run build && node --test --test-name-pattern='rounded CSS|rounded video|radius|circle.*(?:cache|bound)|triangle occlusion|span cache|class.*(?:capacity|proof|token)|Display|v16|v17|v19|custom-property' test/analyze.test.mjs
        working-directory: packages/geatsc-plugin-gea
      - run: bash packages/core/test/run-bouncing-balls-regressions.sh --mutations
      - run: GEA_BALLS_SHARED_STYLES=1 bash packages/core/test/run-bouncing-balls-regressions.sh
      - run: GEA_BALLS_SHARED_STYLES=1 GEA_BALLS_WIDTH_PERCENT=0 GEA_BALLS_HEIGHT_PERCENT=0 bash packages/core/test/run-bouncing-balls-regressions.sh --compact-classes
      - run: GEA_BALLS_SHARED_STYLES=1 bash packages/core/test/run-bouncing-balls-regressions.sh --compact-classes
      - run: GEA_BALLS_STATE_DYNAMIC_INIT=1 GEA_BALLS_PERF=0 GEA_BALLS_SHARED_STYLES=1 bash packages/core/test/run-bouncing-balls-regressions.sh --compact-classes
      - run: GEA_BALLS_NARROW_STYLE=1 GEA_BALLS_BASE_STYLE_PRUNED=1 GEA_BALLS_CUSTOM_PROPERTIES=0 GEA_BALLS_WIDTH_PERCENT=0 GEA_BALLS_HEIGHT_PERCENT=0 GEA_BALLS_PERF=0 GEA_BALLS_SHARED_STYLES=1 bash packages/core/test/run-bouncing-balls-regressions.sh --compact-classes
      - run: GEA_BALLS_BASE_STYLE_PRUNED=1 GEA_BALLS_CUSTOM_PROPERTIES=0 GEA_BALLS_WIDTH_PERCENT=0 GEA_BALLS_HEIGHT_PERCENT=0 bash packages/core/test/run-bouncing-balls-regressions.sh --compact-classes
      - run: bash packages/core/test/run-renderer-features.sh
      - run: bash packages/core/test/run-rotated-projected-text.sh
      - run: bash packages/core/test/run-text-sprite-cache.sh --mutations
      - run: bash packages/core/test/run-gea-retained-absolute-subtree.sh
